[project]
name = "vsin-twitter-pipeline"
version = "0.1.0"
description = "Automated VSiN RSS to Typefully Twitter pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "lxml>=5.3.0",
  "lxml_html_clean>=0.4.3",
  "openai>=1.60.2",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "python-dateutil>=2.9.0.post0",
  "sqlalchemy>=2.0.38",
  "tenacity>=9.0.0",
  "trafilatura>=1.12.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.7",
]

[project.scripts]
vsin-pipeline-run = "vsin_twitter_pipeline.orchestration.main:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
